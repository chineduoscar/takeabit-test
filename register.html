<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./register.css" />
</head>
<body>

    <header>
      <section class="header-section">
        <section class="header-container">
          <div>
            <span class="logo">TakeABit</span>
          </div>

          <nav class="lg-nav">
            <ul class="nav-lists">
              <li><a href="index.html">Home</a></li>
              <li><a href="about.html">About</a></li>
              <li><a href="">Menu</a></li>
              <li><a href="">Contact</a></li>
            </ul>
          </nav>

          <div class="right-btns">
            <button class="login-btn">Login</button>
            <a href="register.html"> <button class="register-btn">Register</button></a>

            <label for="menu" class="menu-icon">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                height="24px"
                viewBox="0 -960 960 960"
                width="24px"
                fill="#ffffff"
              >
                <path
                  d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"
                />
              </svg>
            </label>
          </div>
        </section>

        <input type="checkbox" id="menu" />

        <nav class="sm-nav">
          <ul class="navs">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="">Menu</a></li>
            <li><a href="">Contact</a></li>
          </ul>

          <button class="sm-login-btn">Login</button>
          <a href="register.html"><button class="sm-register-btn">Register</button></a>
        </nav>
      </section>
    </header>


   <section class="register-form">
    <div class="reg-form">
        <h3>Register Here</h3>
        <form action="post">
            <div class="input-group">
                <label for="full_name">Full Name</label>
                <input type="text" name="full_name" id="full_name" placeholder="John Doe">
            </div>
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" name="email" id="email" placeholder="you@example.com">
            </div>
            <div class="input-group">
                <label for="phone_number">Phone Number</label>
                <input type="tel" name="phone_number" id="phone_number" placeholder="+1 (555) 000-0000">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" placeholder="••••••••">
            </div>
            <div class="input-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" name="confirm_password" id="confirm_password" placeholder="••••••••">
            </div>
            <button type="submit">Create Account</button>
        </form>
    </div>
</section>


    <footer>
      <div class="container">
        <h2>TakeABit</h2>

        <p>Fresh Pizza. Fast Delivery. Happy Customers.</p>

        <div class="footer-links">
          <a href="./index.html">Home</a>
          <a href="./about.html">About</a>
          <a href="#">Menu</a>
          <a href="#">Contact</a>
        </div>

        <small> © 2026 TakeABit. All Rights Reserved. </small>
      </div>
    </footer>
    
</body>
</html>
